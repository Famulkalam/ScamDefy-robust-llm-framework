# ScamDefy Configuration

project:
  name: "ScamDefy"
  version: "1.0.0"
  output_dir: "experiments"

reproducibility:
  random_seed: 42

data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  train_split: 0.7
  valid_split: 0.15
  test_split: 0.15
  imbalance_ratio_test: 0.01  # 1% scam in test set for production simulation

training:
  model_name: "distilroberta-base"
  batch_size: 16
  learning_rate: 2e-5
  epochs: 5
  early_stopping_patience: 2
  adversarial_mix_ratio: 0.5  # 50% adversarial examples in training (v1.1 Hardening)

adversarial:
  attacks:
    - "character_perturbation"
    - "synonym_substitution"
    - "llm_paraphrase"
  llm_provider: "openai"  # Options: openai, anthropic, local
  llm_model: "gpt-4o-mini"

success_criteria:
  min_clean_f1: 0.92
  max_robust_drop_percent: 10
  max_latency_p95_ms: 20  # @ batch=1
  min_precision_imbalanced: 0.90
